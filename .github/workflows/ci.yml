name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run local CI script
        run: ./scripts/ci_local.sh

      - name: Guard spec changes
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'spec:')
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^docs/spec/' \
            && { echo "Spec changed without a 'spec:' PR title"; exit 1; } || true

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}